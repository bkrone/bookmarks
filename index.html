<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start</title>
<style>
  :root{
    --bg: #0b0e0d;
    --panel: #121615;
    --panel-2: #171c1b;
    --line: #232b29;
    --text: #e8ece9;
    --text-dim: #8a9490;
    --accent: #ff7a30;
    --accent-dim: #7a3d1c;
    --mono: 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height:100vh;
  }
  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255,122,48,0.06), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(255,122,48,0.04), transparent 40%);
  }
  .wrap{
    max-width: 1100px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  header{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 24px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap: 10px;
  }
  .brand .dot{
    width:10px; height:10px;
    border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    display:inline-block;
    transform: translateY(-1px);
  }
  h1{
    font-size: 22px;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin:0;
    font-family: var(--mono);
    text-transform: uppercase;
  }
  .clock{
    font-family: var(--mono);
    color: var(--text-dim);
    font-size: 13px;
    text-align: right;
  }
  .clock .time{
    font-size: 20px;
    color: var(--text);
    letter-spacing: 0.03em;
  }
  .search-row{
    margin-bottom: 28px;
  }
  #search{
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 16px;
    padding: 14px 16px;
    border-radius: 8px;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.15s ease;
  }
  #search::placeholder{ color: var(--text-dim); }
  #search:focus{ border-color: var(--accent); }
  .chips{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .chip{
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    transition: all 0.12s ease;
  }
  .chip:hover{ color: var(--text); border-color: #3a4441; }
  .chip.active{
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
  }
  .cat{
    margin-bottom: 30px;
  }
  .cat-title{
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin: 0 0 12px 2px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .cat-title::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 10px;
  }
  a.card{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    text-decoration:none;
    color: var(--text);
    font-size: 13.5px;
    transition: border-color 0.12s ease, background 0.12s ease, transform 0.12s ease;
    min-width:0;
  }
  a.card:hover{
    border-color: var(--accent-dim);
    background: var(--panel-2);
    transform: translateY(-1px);
  }
  a.card img{
    width:16px; height:16px;
    flex-shrink:0;
    border-radius:3px;
    background: #1e2422;
  }
  a.card span{
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty{
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 13px;
    padding: 40px 0;
    text-align:center;
    display:none;
  }
  footer{
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11.5px;
    display:flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  kbd{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: var(--mono);
  }
  @media (max-width: 600px){
    h1{ font-size: 17px; }
    .clock{ display:none; }
  }
</style>

  <div class="empty" id="empty">No matches.</div>

  <footer>
    <span id="count"></span>
    <span>Press <kbd>/</kbd> to search · Enter opens the top result</span>

const resultsEl = document.getElementById('results');
const chipsEl = document.getElementById('chips');
const searchEl = document.getElementById('search');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');

let activeCategory = null;

function favicon(url){
  try{
    const u = new URL(url);
    return `https://www.google.com/s2/favicons?sz=64&domain=${u.hostname}`;
  }catch(e){
    return '';
  }
}

function totalCount(){
  return DATA.reduce((n,c)=>n+c.links.length,0);
}

function buildChips(){
  chipsEl.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip active';
  allChip.textContent = 'All';
  allChip.onclick = () => { activeCategory = null; render(); updateChips(); };
  chipsEl.appendChild(allChip);

  DATA.forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = cat.category;
    chip.dataset.cat = cat.category;
    chip.onclick = () => { activeCategory = cat.category; render(); updateChips(); };
    chipsEl.appendChild(chip);
  });
}

function updateChips(){
  [...chipsEl.children].forEach(c => {
    const isAll = c.textContent === 'All';
    c.classList.toggle('active', activeCategory === null ? isAll : c.dataset.cat === activeCategory);
  });
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = '';
  let shown = 0;

  DATA.forEach(cat => {
    if (activeCategory && cat.category !== activeCategory) return;
    const matches = cat.links.filter(l =>
      !q || l.title.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)
    );
    if (matches.length === 0) return;

    const catDiv = document.createElement('div');
    catDiv.className = 'cat';
    const titleDiv = document.createElement('div');
    titleDiv.className = 'cat-title';
    titleDiv.textContent = cat.category;
    catDiv.appendChild(titleDiv);

    const grid = document.createElement('div');
    grid.className = 'grid';
    matches.forEach(l => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener';
      const img = document.createElement('img');
      img.src = favicon(l.url);
      img.alt = '';
      img.loading = 'lazy';
      const span = document.createElement('span');
      span.textContent = l.title;
      a.appendChild(img);
      a.appendChild(span);
      grid.appendChild(a);
      shown++;
    });
    catDiv.appendChild(grid);
    resultsEl.appendChild(catDiv);
  });

  emptyEl.style.display = shown === 0 ? 'block' : 'none';
  countEl.textContent = q || activeCategory
    ? `${shown} of ${totalCount()} links`
    : `${totalCount()} links · ${DATA.length} categories`;
}

searchEl.addEventListener('input', render);

document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl){
    e.preventDefault();
    searchEl.focus();
  }
  if (e.key === 'Enter' && document.activeElement === searchEl){
    const firstCard = resultsEl.querySelector('a.card');
    if (firstCard) window.open(firstCard.href, '_blank');
  }
  if (e.key === 'Escape'){
    searchEl.value = '';
    render();
    searchEl.blur();
  }
});

function tick(){
  const now = new Date();
  document.getElementById('time').textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  document.getElementById('date').textContent = now.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric', year:'numeric'});
}
tick();
setInterval(tick, 1000 * 30);

buildChips();
render();
